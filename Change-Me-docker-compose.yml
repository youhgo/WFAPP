version: "2"

services:
  reverse_proxy:
    image: "traefik:latest"
    container_name: "wapp_traefik"
    ports:
      - "443:443"
      - "8080:8080"
    volumes:
      - ./dependencies/traefik/certs:/etc/certs
      - ./dependencies/traefik/config.yml:/etc/traefik/config.yml
      - ./dependencies/traefik/traefik.yml:/etc/traefik/traefik.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - wappNet
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik=true"
    depends_on:
      - redis

  redis:
    container_name: 'wapp_redis'
    image: 'redis:4-alpine'
    ports:
      - '6379:6379'
    expose:
      - '6379'
    networks:
        - wappNet
    volumes:
      - /please/change/me/redis_data:/data

  wapp_api:
    build:
      context: api/
      dockerfile: docker_files/Dockerfile
    container_name: "wapp_api"
    image: wapp-api
    networks:
      - wappNet
    labels:
      # Router pour l'API
      - "traefik.enable=true"
      - "traefik.http.routers.wapp-api.rule=Host(`wapp.localhost`) && PathPrefix(`/api`)"
      - "traefik.http.routers.wapp-api.tls=true"
      - "traefik.http.routers.wapp-api.service=wapp-api"
      # Router pour les pages web (GUI)
      - "traefik.http.routers.wapp-gui.rule=Host(`wapp.localhost`)"
      - "traefik.http.routers.wapp-gui.tls=true"
      - "traefik.http.routers.wapp-gui.service=wapp-api"
      # Définition du service wapp-api une seule fois
      - "traefik.http.services.wapp-api.loadbalancer.server.port=8880"
    volumes:
      - /please/change/me/shared:/python-docker/shared_files/

  wapp_worker:
    image: wapp-worker
    build:
      context: ./APPEngine
      dockerfile: docker_files/Dockerfile
    command : celery -A tasks worker -l info -E -Q parse
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      TOOL_PATH: "/python-docker/WAPP_MODULE/outils"
      ELK_HOST: ${ELK_HOST}
      ELK_PORT: ${ELK_PORT}
      ELK_USER: ${ELK_USER}
      ELK_PASSWD: ${ELK_PASSWD}
      SPLUNK_HOST: ${SPLUNK_HOST}
      SPLUNK_PORT: ${SPLUNK_PORT}
      SPLUNK_TOKEN: ${SPLUNK_TOKEN}

    volumes:
      - /please/change/me/shared:/python-docker/shared_files/
    depends_on:
      - redis
    networks:
      - wappNet

networks:
    wappNet:

volumes:
  shared_files:

