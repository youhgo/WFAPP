<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile & Administration | WFAPP</title>
    <script src="{{ url_for('static', filename='vendor/tailwindcss.js') }}"></script>
    <style>
        @import url("{{ url_for('static', filename='vendor/inter.css') }}");
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            min-height: 100vh;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 50;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
        }
        .modal.active { display: flex; }
        .blur-key {
            filter: blur(5px);
            transition: filter 0.3s ease;
            cursor: pointer;
            user-select: none;
        }
        .blur-key:hover, .blur-key.revealed {
            filter: blur(0px);
            user-select: auto;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }
    </style>
</head>
<body class="p-6 md:p-12">

    <!-- Header / Navigation -->
    <div class="max-w-6xl mx-auto flex justify-between items-center mb-10">
        <div class="flex items-center space-x-4">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center font-bold text-lg shadow-lg">
                W
            </div>
            <h1 class="text-2xl font-bold tracking-wide">WFAPP Portal</h1>
        </div>
        <div class="space-x-4 flex items-center">
            <a href="/index" class="text-slate-300 hover:text-white transition-colors">Back to Dashboard</a>
            <button id="logoutButton" class="px-5 py-2 bg-rose-500/20 text-rose-300 border border-rose-500/30 rounded-lg hover:bg-rose-500 hover:text-white transition-all duration-300 font-medium shadow-lg shadow-rose-500/20">
                Disconnect
            </button>
        </div>
    </div>

    <!-- Main Container -->
    <div class="max-w-6xl mx-auto space-y-8">
        
        <!-- Status Messages -->
        <div id="statusContainer" class="hidden p-4 rounded-lg text-center font-medium transition-all"></div>

        <!-- My Profile Section -->
        <div class="glass-panel rounded-2xl p-8">
            <div class="flex items-center justify-between mb-6 border-b border-slate-700/50 pb-4">
                <h2 class="text-xl font-semibold text-slate-100 flex items-center">
                    <svg class="w-5 h-5 mr-2 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    My Profile
                </h2>
                <span id="myRoleBadge" class="px-3 py-1 text-xs font-semibold rounded-full bg-slate-800 text-slate-300 border border-slate-700">Loading...</span>
            </div>
            
            <div class="grid md:grid-cols-2 gap-8">
                <div>
                    <p class="text-sm text-slate-400 mb-1">Username</p>
                    <p id="myUsername" class="text-lg font-medium text-white mb-6">...</p>
                    
                    <p class="text-sm text-slate-400 mb-1">My API Key</p>
                    <div class="bg-slate-900/50 border border-slate-700/50 rounded-lg p-4 font-mono text-sm break-all">
                        <span id="myApiKey" class="blur-key" onclick="this.classList.toggle('revealed')">Loading...</span>
                    </div>
                    <p class="text-xs text-slate-500 mt-2">Hover or click to reveal your API key. Keep this secret!</p>
                </div>
                
                <div class="flex flex-col justify-center space-y-4">
                    <button onclick="manageMyApiKey('generate')" class="w-full py-3 bg-gradient-to-r from-indigo-500 to-purple-600 rounded-xl font-medium text-white shadow-lg shadow-indigo-500/20 hover:shadow-indigo-500/40 hover:-translate-y-0.5 transition-all">
                        Generate New API Key
                    </button>
                    <button onclick="manageMyApiKey('revoke')" class="w-full py-3 bg-slate-800 border border-slate-700 rounded-xl font-medium text-slate-300 hover:bg-rose-500/20 hover:text-rose-400 hover:border-rose-500/30 transition-all">
                        Revoke Current API Key
                    </button>
                </div>
            </div>
        </div>

        <!-- Admin Panel (Hidden by default) -->
        <div id="adminPanel" class="hidden space-y-8">
            <div class="glass-panel rounded-2xl p-8">
                <div class="flex items-center justify-between mb-6 border-b border-slate-700/50 pb-4">
                    <h2 class="text-xl font-semibold text-slate-100 flex items-center">
                        <svg class="w-5 h-5 mr-2 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                        User Administration
                    </h2>
                    <button onclick="document.getElementById('addUserModal').classList.add('active')" class="px-4 py-2 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-lg hover:bg-emerald-500 hover:text-white transition-all text-sm font-medium">
                        + Add User
                    </button>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="text-slate-400 text-sm border-b border-slate-700/50">
                                <th class="pb-3 px-4 font-medium">Username</th>
                                <th class="pb-3 px-4 font-medium">Role</th>
                                <th class="pb-3 px-4 font-medium">API Key</th>
                                <th class="pb-3 px-4 text-right font-medium">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="userList" class="text-sm">
                            <!-- Users injected here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Add User Modal -->
    <div id="addUserModal" class="modal">
        <div class="glass-panel p-8 rounded-2xl w-full max-w-md shadow-2xl relative">
            <h2 class="text-xl font-bold mb-6">Add New User</h2>
            <form id="addUserForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Username</label>
                    <input type="text" id="newUsername" required class="w-full bg-slate-900/50 border border-slate-700 rounded-lg p-3 text-white focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none transition-all">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Password</label>
                    <input type="password" id="newPassword" required class="w-full bg-slate-900/50 border border-slate-700 rounded-lg p-3 text-white focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none transition-all">
                </div>
                <div class="flex justify-end space-x-3 mt-8">
                    <button type="button" onclick="document.getElementById('addUserModal').classList.remove('active')" class="px-4 py-2 rounded-lg text-slate-300 hover:bg-slate-800 transition-colors">Cancel</button>
                    <button type="submit" class="px-6 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg transition-colors shadow-lg shadow-emerald-600/20">Add User</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit User Modal -->
    <div id="editModal" class="modal">
        <div class="glass-panel p-8 rounded-2xl w-full max-w-lg shadow-2xl relative max-h-[90vh] overflow-y-auto">
            <h2 class="text-xl font-bold mb-6 border-b border-slate-700/50 pb-4">Manage User</h2>
            <form id="editForm" class="space-y-5">
                <input type="hidden" id="editUserId">
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Username</label>
                        <input type="text" id="editUsername" required class="w-full bg-slate-900/50 border border-slate-700 rounded-lg p-2.5 text-white outline-none focus:border-indigo-500 transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Change Password (leave blank to keep)</label>
                        <input type="password" id="editPassword" class="w-full bg-slate-900/50 border border-slate-700 rounded-lg p-2.5 text-white outline-none focus:border-indigo-500 transition-all">
                    </div>
                </div>

                <div class="flex items-center p-3 bg-slate-800/50 rounded-lg border border-slate-700/50">
                    <input type="checkbox" id="editIsAdmin" class="w-4 h-4 text-indigo-500 rounded border-slate-600 bg-slate-700 focus:ring-indigo-500 focus:ring-offset-slate-900">
                    <label class="ml-3 text-sm font-medium text-slate-200">Administrator Privileges</label>
                </div>

                <div class="border-t border-slate-700/50 pt-5 mt-5">
                    <h3 class="text-sm font-semibold text-slate-300 mb-3">API Key Management</h3>
                    
                    <div class="mb-3">
                        <label class="block text-xs font-medium text-slate-400 mb-1">Current API Key</label>
                        <div class="bg-slate-900/80 border border-slate-700/50 rounded-lg p-3 font-mono text-xs break-all text-slate-300">
                            <span id="editCurrentApiKey"></span>
                        </div>
                    </div>
                    
                    <div class="flex space-x-2 mb-4">
                        <button type="button" onclick="document.getElementById('editKeyAction').value = 'generate'; document.getElementById('customKeyContainer').classList.add('hidden');" class="flex-1 py-2 bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 hover:bg-indigo-500 hover:text-white rounded-lg text-xs transition-colors">
                            Auto Generate
                        </button>
                        <button type="button" onclick="document.getElementById('editKeyAction').value = 'revoke'; document.getElementById('customKeyContainer').classList.add('hidden');" class="flex-1 py-2 bg-rose-500/20 text-rose-300 border border-rose-500/30 hover:bg-rose-500 hover:text-white rounded-lg text-xs transition-colors">
                            Revoke
                        </button>
                        <button type="button" onclick="document.getElementById('editKeyAction').value = 'custom'; document.getElementById('customKeyContainer').classList.remove('hidden');" class="flex-1 py-2 bg-slate-700 text-slate-300 hover:bg-slate-600 rounded-lg text-xs transition-colors">
                            Set Custom
                        </button>
                    </div>

                    <input type="hidden" id="editKeyAction" value="none">

                    <div id="customKeyContainer" class="hidden">
                        <label class="block text-xs font-medium text-slate-400 mb-1">Custom API Key</label>
                        <input type="text" id="editCustomApiKey" placeholder="Enter custom key..." class="w-full bg-slate-900/50 border border-slate-700 rounded-lg p-2.5 text-white outline-none focus:border-indigo-500 transition-all text-sm">
                    </div>
                </div>

                <div class="flex justify-end space-x-3 pt-4">
                    <button type="button" onclick="document.getElementById('editModal').classList.remove('active')" class="px-4 py-2 rounded-lg text-slate-300 hover:bg-slate-800 transition-colors">Cancel</button>
                    <button type="submit" class="px-6 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg transition-colors shadow-lg shadow-blue-600/20">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Setup Toast Notifications
        function showStatus(message, isError = false) {
            const container = document.getElementById('statusContainer');
            container.textContent = message;
            container.className = `p-4 rounded-lg text-center font-medium shadow-lg mb-6 transform transition-all ${isError ? 'bg-rose-500/20 text-rose-300 border border-rose-500/30' : 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30'}`;
            container.style.display = 'block';
            setTimeout(() => { container.style.display = 'none'; }, 5000);
        }

        // Fetch My Profile
        async function fetchMyProfile() {
            try {
                const res = await fetch('/api/me');
                if (res.ok) {
                    const me = await res.json();
                    document.getElementById('myUsername').textContent = me.username;
                    const badge = document.getElementById('myRoleBadge');
                    if (me.is_admin) {
                        badge.textContent = "Administrator";
                        badge.className = "px-3 py-1 text-xs font-semibold rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30";
                        document.getElementById('adminPanel').classList.remove('hidden');
                        fetchUsers(); // Load admin panel data
                    } else {
                        badge.textContent = "Standard User";
                        badge.className = "px-3 py-1 text-xs font-semibold rounded-full bg-slate-800 text-slate-300 border border-slate-700";
                    }
                    
                    const keyEl = document.getElementById('myApiKey');
                    if (me.api_key) {
                        keyEl.textContent = me.api_key;
                        keyEl.classList.add('blur-key');
                    } else {
                        keyEl.textContent = "No active key. Please generate one.";
                        keyEl.classList.remove('blur-key');
                    }
                }
            } catch (e) {
                console.error("Error loading profile", e);
            }
        }

        // Manage My API Key
        async function manageMyApiKey(action) {
            if (action === 'revoke' && !confirm("Are you sure you want to revoke your API key? You will lose API access immediately.")) return;
            
            try {
                const res = await fetch('/api/me/api_key', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action })
                });
                if (res.ok) {
                    showStatus(`API Key ${action === 'generate' ? 'generated' : 'revoked'} successfully!`);
                    fetchMyProfile();
                } else {
                    const data = await res.json();
                    showStatus(data.message || "Failed to update API key.", true);
                }
            } catch (e) {
                showStatus("Network error.", true);
            }
        }

        // Fetch All Users (Admin)
        async function fetchUsers() {
            try {
                const res = await fetch('/api/users');
                if (!res.ok) return;
                
                const users = await res.json();
                const list = document.getElementById('userList');
                list.innerHTML = '';
                
                users.forEach(user => {
                    const tr = document.createElement('tr');
                    tr.className = "border-b border-slate-700/30 hover:bg-slate-800/30 transition-colors";
                    
                    const keyDisplay = user.api_key ? `<span class="blur-key font-mono text-xs text-slate-400 bg-slate-900/50 px-2 py-1 rounded border border-slate-700/50" onclick="this.classList.toggle('revealed')">${user.api_key}</span>` : `<span class="text-xs text-slate-500 italic">None</span>`;
                    
                    tr.innerHTML = `
                        <td class="py-4 px-4 font-medium text-slate-200">${user.username}</td>
                        <td class="py-4 px-4">
                            ${user.is_admin ? '<span class="text-xs bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 rounded-full px-2.5 py-0.5">Admin</span>' : '<span class="text-xs bg-slate-800 text-slate-400 border border-slate-700 rounded-full px-2.5 py-0.5">User</span>'}
                        </td>
                        <td class="py-4 px-4 max-w-[200px] truncate">${keyDisplay}</td>
                        <td class="py-4 px-4 text-right space-x-2">
                            <button onclick="openEditModal(${user.id}, '${user.username}', ${user.is_admin}, '${user.api_key || ''}')" class="text-xs bg-blue-500/20 text-blue-300 hover:bg-blue-500 hover:text-white px-3 py-1.5 rounded transition-colors">Manage</button>
                            <button onclick="deleteUser(${user.id})" class="text-xs bg-rose-500/20 text-rose-300 hover:bg-rose-500 hover:text-white px-3 py-1.5 rounded transition-colors">Delete</button>
                        </td>
                    `;
                    list.appendChild(tr);
                });
            } catch (e) {
                console.error("Error fetching users", e);
            }
        }

        // Open Edit Modal
        function openEditModal(id, username, isAdmin, apiKey) {
            document.getElementById('editUserId').value = id;
            document.getElementById('editUsername').value = username;
            document.getElementById('editPassword').value = '';
            document.getElementById('editIsAdmin').checked = isAdmin;
            document.getElementById('editCurrentApiKey').textContent = apiKey || 'None';
            document.getElementById('editKeyAction').value = 'none';
            document.getElementById('customKeyContainer').classList.add('hidden');
            document.getElementById('editCustomApiKey').value = '';
            
            document.getElementById('editModal').classList.add('active');
        }

        // Submit Edit Form
        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('editUserId').value;
            const body = {
                username: document.getElementById('editUsername').value,
                is_admin: document.getElementById('editIsAdmin').checked
            };
            
            const pwd = document.getElementById('editPassword').value;
            if (pwd) body.password = pwd;

            const keyAction = document.getElementById('editKeyAction').value;
            if (keyAction === 'generate') body.generate_api_key = true;
            if (keyAction === 'revoke') body.revoke_api_key = true;
            if (keyAction === 'custom') body.api_key = document.getElementById('editCustomApiKey').value;

            try {
                const res = await fetch(`/api/users/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                
                if (res.ok) {
                    showStatus("User updated successfully.");
                    document.getElementById('editModal').classList.remove('active');
                    fetchUsers();
                    fetchMyProfile(); // Refresh my profile in case I edited myself
                } else {
                    const data = await res.json();
                    showStatus(data.message || "Failed to update user.", true);
                }
            } catch (err) {
                showStatus("Network error.", true);
            }
        });

        // Add User
        document.getElementById('addUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('newUsername').value;
            const password = document.getElementById('newPassword').value;
            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                if (res.ok) {
                    showStatus("User added successfully.");
                    document.getElementById('addUserModal').classList.remove('active');
                    fetchUsers();
                    e.target.reset();
                } else {
                    const data = await res.json();
                    showStatus(data.message || "Failed to add user.", true);
                }
            } catch (err) {
                showStatus("Network error.", true);
            }
        });

        // Delete User
        async function deleteUser(id) {
            if (!confirm("Are you sure you want to completely delete this user?")) return;
            try {
                const res = await fetch(`/api/users/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    showStatus("User deleted successfully.");
                    fetchUsers();
                } else {
                    showStatus("Failed to delete user.", true);
                }
            } catch (err) {
                showStatus("Network error.", true);
            }
        }

        // Logout
        document.getElementById('logoutButton').addEventListener('click', async () => {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/login_page';
        });

        // Init
        fetchMyProfile();

    </script>
</body>
</html>
